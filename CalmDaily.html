<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>CalmDaily</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #F1F0EE;
      --page-max: 750px;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg-color);
      color: #333;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      max-width: var(--page-max);
      margin: 0 auto;
      background: var(--bg-color);
      position: relative;
    }

    /* ── 背景视频（纯装饰，不占布局空间） ── */
    .page-bg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      z-index: 0;
      pointer-events: none;
      line-height: 0;
    }

    .page-bg video {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── 顶部内容：标题 + 九宫格（叠在背景视频上） ── */
    .top-block {
      position: relative;
      z-index: 1;
      padding: calc(28px + env(safe-area-inset-top)) 16px 20px;
    }

    .title-img {
      display: block;
      width: 92%;
      max-width: 360px;
      margin: 0 auto 24px;
    }

    /* ── 主内容区 ── */
    .content {
      position: relative;
      z-index: 1;
      background: transparent;
      padding: 20px 16px 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    /* ── 九宫格按钮 ── */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
    }

    .nav-btn {
      display: block;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn img {
      display: block;
      width: 100%;
      height: auto;
    }

    .nav-btn:active { opacity: 0.82; }

    /* ── 直播区块：遮罩与播放器、标题同一体系 ── */
    .live-section {
      display: none;
      position: relative;
      z-index: 1;
      margin-bottom: 28px;
      padding-bottom: 20px;
    }

    .live-section.is-visible { display: block; }

    .live-stage-bg {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      z-index: 0;
      width: 100vw;
      height: 100%;
      transform: translateX(-50%) translateY(8px);
      object-fit: fill;
      pointer-events: none;
    }

    .live-player-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      /* 始终横屏 16:9，旧 WebView 用 padding 兜底 */
      aspect-ratio: 16 / 9;
      height: 0;
      padding-bottom: 56.25%;
    }

    @supports (aspect-ratio: 16 / 9) {
      .live-player-wrap {
        height: auto;
        padding-bottom: 0;
      }
    }

    .live-player-wrap video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center center;
      /* 部分 App WebView 对 video 的 object-fit 支持差，用居中裁切兜底 */
    }

    .mute-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .mute-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .live-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 0 2px;
    }

    .live-badge {
      position: relative;
      width: 52px;
      height: 18px;
      flex-shrink: 0;
    }

    .live-badge img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 底层是无红点图；上层带红点图亮灭，LIVE 灯才看得见闪 */
    .live-badge img:nth-child(1) {
      z-index: 1;
      animation: live-blink 3s ease-in-out infinite;
    }

    @keyframes live-blink {
      0%, 40% { opacity: 1; }
      50%, 90% { opacity: 0; }
      100% { opacity: 1; }
    }

    .live-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 500;
      color: #222;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .live-enter {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      border: 0;
      padding: 4px 2px 4px 8px;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .live-enter img {
      display: block;
      height: 14px;
      width: auto;
    }

    .live-enter:active { opacity: 0.7; }

    /* ── 瀑布流 ── */
    .waterfall {
      position: relative;
      z-index: 1;
      column-count: 2;
      column-gap: 10px;
      background: var(--bg-color);
    }

    .wf-card {
      break-inside: avoid;
      margin-bottom: 10px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      cursor: pointer;
    }

    .wf-card-media {
      position: relative;
      background: #e8e7e5;
    }

    .wf-card-cover {
      width: 100%;
      display: block;
      background: #e8e7e5;
    }

    img.wf-card-cover,
    video.wf-card-cover {
      height: auto;
    }

    div.wf-card-cover {
      aspect-ratio: 4 / 3;
    }

    .wf-play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .wf-play::after {
      content: "";
      position: absolute;
      left: 14px;
      top: 11px;
      border-style: solid;
      border-width: 7px 0 7px 12px;
      border-color: transparent transparent transparent #fff;
    }

    .wf-card-body { padding: 10px 10px 12px; }

    .wf-card-title {
      font-size: 13px;
      font-weight: 500;
      color: #222;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .wf-card-time {
      margin-top: 6px;
      font-size: 11px;
      color: #999;
    }

    .load-sentinel {
      height: 1px;
      visibility: hidden;
    }

    .load-status {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 16px 0 8px;
      font-size: 13px;
      color: #aaa;
      background: var(--bg-color);
    }

    .load-status.is-end {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0 8px;
      color: transparent;
      font-size: 0;
    }

    .load-status.is-end::before,
    .load-status.is-end::after {
      content: "";
      width: 96px;
      height: 1px;
      background: #dcdcdc;
    }

    .load-status.is-end .end-dot {
      width: 4px;
      height: 4px;
      margin: 0 10px;
      background: #dcdcdc;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .load-status.hidden { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-bg" aria-hidden="true">
      <video
        src="assets/bg-video.mp4"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5"
      ></video>
    </div>

    <div class="top-block">
      <img class="title-img" src="assets/biaoti.png" alt="24小时AI中青报·舒压日报" />
      <div class="nav-grid" id="navGrid"></div>
    </div>

    <div class="content">
      <!-- 直播（无直播时隐藏） -->
      <section class="live-section" id="liveSection">
        <img class="live-stage-bg" src="assets/zhezhao-zhibo.png" alt="" />
        <div class="live-player-wrap">
          <video
            id="liveVideo"
            playsinline
            webkit-playsinline
            x5-playsinline
            x5-video-player-type="h5"
            x5-video-player-fullscreen="false"
            preload="auto"
          ></video>
          <button class="mute-btn" id="muteBtn" type="button" aria-label="切换静音">
            <svg id="iconMuted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            <svg id="iconUnmuted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>
        <div class="live-meta">
          <div class="live-badge">
            <img src="assets/zhibozhong.png" alt="直播中" />
            <img src="assets/zhibozhong2.png" alt="" />
          </div>
          <p class="live-title" id="liveTitle"></p>
          <button class="live-enter" id="liveEnterBtn" type="button" aria-label="进入直播">
            <img src="assets/jinruzhibo.png" alt="" />
          </button>
        </div>
      </section>

      <!-- 瀑布流 -->
      <div class="waterfall" id="waterfall"></div>
      <div class="load-sentinel" id="loadSentinel"></div>
      <p class="load-status" id="loadStatus">加载中…</p>
    </div>
  </div>

  <script>
    /* ── 配置区（后续在此接入直播 & 专栏接口） ── */

    var NAV_BUTTONS = [
      { img: "assets/gaishanshimian.png",  alt: "改善睡眠", jump: { forwardType: "54", contId: "5" } },
      { img: "assets/yundongjianshen.png", alt: "运动健身", jump: { forwardType: "9", contId: "168540" } },
      { img: "assets/zhuanjiakecheng.png", alt: "专家课程", jump: { forwardType: "6", link: "https://news.youth.cn/zt/wrxlzzcz/" } },
      { img: "assets/shuyazixun.png",     alt: "舒压咨询", jump: null },
      { img: "assets/yishengkepu.png",    alt: "医生科普", jump: null },
      { img: "assets/xueyezhichang.png",  alt: "学业职场", jump: null },
      { img: "assets/jiatingshejiao.png", alt: "家庭社交", jump: null },
      { img: "assets/xinlijiankang.png",  alt: "心理健康", jump: null },
      { img: "assets/kexuejianzhong.png", alt: "科学减重", jump: null }
    ];

    /**
     * 直播配置：对应端内直播稿件 contId
     * enabled 为 false 时不显示直播区块
     */
    var LIVE_CONFIG = {
      enabled: true,
      contId: "1458876",
      forwardType: "8",
      streamUrl: "https://css.cyol.com/zqh/1458876.m3u8",
      title: "“青年舒压艺术空间”慢直播",
      poster: "https://prod-cyolcos-1409912444.cos.ap-beijing.myqcloud.com/image/20260902/1788311233408.JPEG?imageMogr2/thumbnail/1000x/ignore-error/1"
    };

    var LIVE_DETAIL_API = "https://api.cyol.com/app/liveNews/liveNewsDetails";
    var HLS_JS_SRC = "https://cdn.bootcdn.net/ajax/libs/hls.js/1.5.17/hls.min.js";

    /**
     * 专题瀑布流：拉取多个专题的稿件合并展示
     * 优先走免鉴权开放接口，失败则回退到上游 specialNews/details
     */
    var SPECIAL_CONFIG = {
      contIds: ["168540", "265762", "265746"],
      api: "https://api-pre.cyol.com/app5/open/api/content/special-news-details",
      fallbackApi: "https://api-pre.cyol.com/specialNews/details"
    };

    var PAGE_SIZE = 10;
    var GUEST_TOKEN = "Ecmmu18epJdP89fIlvX";

    /* ── App 跳转桥（与 index.html 一致） ── */

    function jump(params) {
      var payload = JSON.stringify(params);
      try {
        if (window.cyol && typeof window.cyol.cyolInAppRouter === "function") {
          window.cyol.cyolInAppRouter(payload);
          return;
        }
        if (
          window.webkit &&
          window.webkit.messageHandlers &&
          window.webkit.messageHandlers.cyolInAppRouter
        ) {
          window.webkit.messageHandlers.cyolInAppRouter.postMessage(payload);
          return;
        }
        console.warn("未检测到中青 App 桥，参数：", payload);
      } catch (e) {
        console.error("跳转失败：", e.message);
      }
    }

    /* ── 渲染导航按钮 ── */

    function renderNav() {
      var grid = document.getElementById("navGrid");
      NAV_BUTTONS.forEach(function (item) {
        var btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.type = "button";
        btn.innerHTML = '<img src="' + item.img + '" alt="' + item.alt + '" />';
        if (item.jump) {
          btn.addEventListener("click", function () { jump(item.jump); });
        }
        grid.appendChild(btn);
      });
    }

    /* ── 直播模块（HLS：iOS 原生 / 其他端 hls.js） ── */

    function loadHlsScript() {
      return new Promise(function (resolve, reject) {
        if (window.Hls) {
          resolve();
          return;
        }
        var script = document.createElement("script");
        script.src = HLS_JS_SRC;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function playHls(video, url) {
      var canNative =
        video.canPlayType("application/vnd.apple.mpegurl") ||
        video.canPlayType("application/x-mpegURL");

      if (canNative) {
        video.src = url;
        video.play().catch(function () {});
        return;
      }

      loadHlsScript()
        .then(function () {
          if (!window.Hls || !Hls.isSupported()) {
            video.src = url;
            video.play().catch(function () {});
            return;
          }
          var hls = new Hls({ enableWorker: true, liveSyncDurationCount: 3 });
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.play().catch(function () {});
          });
        })
        .catch(function () {
          video.src = url;
          video.play().catch(function () {});
        });
    }

    function fitLiveVideoCover(video) {
      var wrap = video && video.parentElement;
      if (!wrap || !video.videoWidth || !video.videoHeight) return;

      var wrapW = wrap.clientWidth;
      var wrapH = wrap.clientHeight;
      if (!wrapW || !wrapH) return;

      var scale = Math.max(wrapW / video.videoWidth, wrapH / video.videoHeight);
      var w = Math.ceil(video.videoWidth * scale);
      var h = Math.ceil(video.videoHeight * scale);

      video.style.position = "absolute";
      video.style.width = w + "px";
      video.style.height = h + "px";
      video.style.left = Math.round((wrapW - w) / 2) + "px";
      video.style.top = Math.round((wrapH - h) / 2) + "px";
      video.style.maxWidth = "none";
      video.style.maxHeight = "none";
      video.style.objectFit = "fill";
    }

    function bindLiveVideoCover(video) {
      var sync = function () { fitLiveVideoCover(video); };
      video.addEventListener("loadedmetadata", sync);
      video.addEventListener("loadeddata", sync);
      video.addEventListener("playing", sync);
      window.addEventListener("resize", sync);
      sync();
    }

    function jumpToLive() {
      jump({
        forwardType: LIVE_CONFIG.forwardType,
        contId: LIVE_CONFIG.contId
      });
    }

    function showLivePlayer(cfg) {
      if (!cfg.streamUrl) return;

      var section = document.getElementById("liveSection");
      var video = document.getElementById("liveVideo");
      var titleEl = document.getElementById("liveTitle");
      var muteBtn = document.getElementById("muteBtn");
      var iconMuted = document.getElementById("iconMuted");
      var iconUnmuted = document.getElementById("iconUnmuted");

      section.classList.add("is-visible");
      titleEl.textContent = cfg.title || "正在直播";
      if (cfg.poster) video.poster = cfg.poster;

      video.muted = true;
      video.autoplay = true;
      video.playsInline = true;
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.setAttribute("x5-playsinline", "");
      video.setAttribute("x5-video-player-fullscreen", "false");

      bindLiveVideoCover(video);
      playHls(video, cfg.streamUrl);

      muteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        video.muted = !video.muted;
        iconMuted.style.display = video.muted ? "" : "none";
        iconUnmuted.style.display = video.muted ? "none" : "";
      });

      titleEl.addEventListener("click", jumpToLive);
      document.getElementById("liveEnterBtn").addEventListener("click", jumpToLive);
    }

    function cyolPost(url, body) {
      return fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json",
          "cyol-client-type": "02",
          "cyol-token": (window.localStorage && localStorage.getItem("cyol-token")) || GUEST_TOKEN
        },
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json();
      });
    }

    function fetchLiveDetail() {
      return cyolPost(LIVE_DETAIL_API, { contId: Number(LIVE_CONFIG.contId) });
    }

    function initLive() {
      if (!LIVE_CONFIG.enabled) return;

      fetchLiveDetail()
        .then(function (json) {
          var data = json && json.data;
          if (!json || json.code !== 200 || !data) {
            showLivePlayer(LIVE_CONFIG);
            return;
          }

          var liveInfo = data.liveInfo || {};
          var streamUrl = liveInfo.liveM3u8Url || liveInfo.liveUrl || "";
          var liveType = Number(liveInfo.liveType);
          var isOnAir = !!streamUrl && (liveType === 3 || liveType === 6) && !data.isExpire;

          if (!isOnAir) return;

          showLivePlayer({
            streamUrl: streamUrl,
            title: data.name || data.title || LIVE_CONFIG.title,
            poster: liveInfo.livePreviewImgUrl || data.coverPic || LIVE_CONFIG.poster
          });
        })
        .catch(function () {
          showLivePlayer(LIVE_CONFIG);
        });
    }

    /* ── 专栏瀑布流 ── */

    var wfState = { page: 1, loading: false, hasMore: true };
    var wfCache = null;

    function unwrapSpecialResponse(json) {
      if (typeof json === "string") {
        try { json = JSON.parse(json); } catch (e) { return null; }
      }
      if (!json || typeof json !== "object") return null;
      if (json.data) return json.data;
      if (json.specialChildList) return json;
      return null;
    }

    function normalizeArticle(item) {
      var share = item.shareInfo || {};
      var video = item.video || {};
      var live = item.liveInfo || {};
      var ft = String(item.forwardType || "4");
      var cover =
        item.pic ||
        item.coverPic ||
        share.coverPic ||
        share.sharePic ||
        video.coverUrl ||
        live.livePreviewImgUrl ||
        "";
      var videoUrl = video.url || video.playUrl || video.videoUrl || "";
      var isVideo =
        ft === "5" ||
        Number(item.contType) === 5 ||
        item.trackArticleType === "视频" ||
        !!videoUrl;

      return {
        id: item.contId,
        title: item.name || item.title || share.title || "",
        cover: cover,
        videoUrl: videoUrl,
        isVideo: isVideo,
        publishTime: item.pubTime || "",
        jump: { forwardType: ft, contId: String(item.contId || "") }
      };
    }

    function flattenSpecialArticles(data) {
      var list = [];
      var children = (data && data.specialChildList) || [];
      children.forEach(function (child) {
        var items = (child.pageInfo && child.pageInfo.list) || [];
        items.forEach(function (item) {
          list.push(normalizeArticle(item));
        });
      });
      return list;
    }

    function fetchSpecialNews(contId) {
      var body = { contId: Number(contId) };
      return cyolPost(SPECIAL_CONFIG.api, body)
        .then(function (json) {
          var data = unwrapSpecialResponse(json);
          if (data && (data.specialChildList || json.code === 200)) return data;
          return cyolPost(SPECIAL_CONFIG.fallbackApi, body).then(unwrapSpecialResponse);
        })
        .catch(function () {
          return cyolPost(SPECIAL_CONFIG.fallbackApi, body).then(unwrapSpecialResponse);
        });
    }

    function mergeSpecialArticles(dataList) {
      var seen = {};
      var list = [];
      dataList.forEach(function (data) {
        flattenSpecialArticles(data).forEach(function (item) {
          var key = String(item.id || "");
          if (!key || seen[key]) return;
          seen[key] = true;
          list.push(item);
        });
      });
      return list;
    }

    /**
     * 抓取专题稿件，做成瀑布流分页
     * @returns {Promise<{ list: Array, hasMore: boolean }>}
     */
    function fetchArticles(page, pageSize) {
      var slicePage = function (all) {
        var start = (page - 1) * pageSize;
        var list = all.slice(start, start + pageSize);
        return { list: list, hasMore: start + list.length < all.length };
      };

      if (wfCache) {
        return Promise.resolve(slicePage(wfCache));
      }

      return Promise.all(
        SPECIAL_CONFIG.contIds.map(function (id) {
          return fetchSpecialNews(id).catch(function () { return null; });
        })
      ).then(function (dataList) {
        wfCache = mergeSpecialArticles(dataList);
        return slicePage(wfCache);
      });
    }

    function escapeAttr(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function createCard(item) {
      var card = document.createElement("article");
      card.className = "wf-card";
      card.dataset.id = item.id;

      var mediaHtml;
      if (item.videoUrl) {
        mediaHtml =
          '<div class="wf-card-media">' +
            '<video class="wf-card-cover" src="' + escapeAttr(item.videoUrl) + '" poster="' + escapeAttr(item.cover) + '" muted playsinline preload="metadata" referrerpolicy="no-referrer"></video>' +
            '<span class="wf-play" aria-hidden="true"></span>' +
          "</div>";
      } else if (item.cover) {
        mediaHtml =
          '<div class="wf-card-media">' +
            '<img class="wf-card-cover" src="' + escapeAttr(item.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer" />' +
            (item.isVideo ? '<span class="wf-play" aria-hidden="true"></span>' : "") +
          "</div>";
      } else {
        mediaHtml = '<div class="wf-card-cover"></div>';
      }

      card.innerHTML =
        mediaHtml +
        '<div class="wf-card-body">' +
          '<p class="wf-card-title">' + escapeHtml(item.title) + "</p>" +
        "</div>";

      card.addEventListener("click", function () {
        if (item.jump) jump(item.jump);
      });

      return card;
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function loadMoreArticles() {
      if (wfState.loading || !wfState.hasMore) return;
      wfState.loading = true;
      var statusEl = document.getElementById("loadStatus");
      statusEl.classList.remove("is-end");
      statusEl.innerHTML = "";
      statusEl.textContent = "加载中…";
      statusEl.classList.remove("hidden");

      fetchArticles(wfState.page, PAGE_SIZE).then(function (data) {
        var container = document.getElementById("waterfall");
        data.list.forEach(function (item) {
          container.appendChild(createCard(item));
        });
        wfState.hasMore = data.hasMore;
        wfState.page += 1;
        wfState.loading = false;

        if (wfState.hasMore) {
          statusEl.classList.remove("is-end");
          statusEl.innerHTML = "";
          statusEl.textContent = "加载中…";
          statusEl.classList.add("hidden");
        } else {
          statusEl.classList.add("is-end");
          statusEl.innerHTML = '<span class="end-dot" aria-hidden="true"></span>';
          statusEl.classList.remove("hidden");
        }
      }).catch(function () {
        wfState.loading = false;
        statusEl.classList.remove("is-end");
        statusEl.innerHTML = "";
        statusEl.textContent = "加载失败，请稍后重试";
        statusEl.classList.remove("hidden");
      });
    }

    function initWaterfall() {
      loadMoreArticles();

      var sentinel = document.getElementById("loadSentinel");
      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) loadMoreArticles();
        }, { rootMargin: "200px" });
        observer.observe(sentinel);
      } else {
        window.addEventListener("scroll", function () {
          if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
            loadMoreArticles();
          }
        });
      }
    }

    /* ── 启动 ── */
    renderNav();
    initLive();
    initWaterfall();
  </script>
</body>
</html>
