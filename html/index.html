<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>跳转测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #f5f6f8;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 24px; }
    .item { margin-bottom: 20px; }
    .meta { font-size: 13px; color: #888; margin-bottom: 12px; line-height: 1.6; }
    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #e60012;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #1a1a1a; }
    button.mini { background: #07c160; }
    button:active { opacity: 0.85; }
    #log {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
      word-break: break-all;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>原生跳转测试</h1>

    <div class="item">
      <p class="meta">forwardType: 54<br />圈子 ID: 5</p>
      <button type="button" onclick="jump({ forwardType: '54', contId: '5' })">进入圈子</button>
    </div>

    <div class="item">
      <p class="meta">forwardType: 9<br />专题 ID: 168540</p>
      <button type="button" class="secondary" onclick="jump({ forwardType: '9', contId: '168540' })">进入专题</button>
    </div>

    <div class="item">
      <p class="meta">forwardType: 36<br />小程序 ID: 97</p>
      <button type="button" class="mini" onclick="jump({ forwardType: '36', contId: '97' })">打开小程序</button>
    </div>

    <p id="log"></p>
  </div>

  <script>
    function log(msg) {
      document.getElementById("log").textContent = msg;
    }

    function jump(params) {
      var payload = JSON.stringify(params);
      try {
        if (window.cyol && typeof window.cyol.cyolInAppRouter === "function") {
          window.cyol.cyolInAppRouter(payload);
          log("已调用 Android 桥\n" + payload);
          return;
        }
        if (
          window.webkit &&
          window.webkit.messageHandlers &&
          window.webkit.messageHandlers.cyolInAppRouter
        ) {
          window.webkit.messageHandlers.cyolInAppRouter.postMessage(payload);
          log("已调用 iOS 桥\n" + payload);
          return;
        }
        log("未检测到中青 App 桥，请在 App 内打开此页。\n参数：" + payload);
      } catch (e) {
        log("调用失败：" + e.message);
      }
    }
  </script>
</body>
</html>
